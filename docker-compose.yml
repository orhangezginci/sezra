services:
  python-service-base:
    image: sezra-python-service-base
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
    profiles:
      - build

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sezra-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: sezra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sezra -d sezra"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sezra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-store-migrations:
    build:
      context: .
      dockerfile: services/event-store-service/Dockerfile
    container_name: sezra-event-store-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./services/event-store-service:/app
    command: >
      sh -c "
        python wait_for_postgres.py &&
        alembic upgrade head
      "

  event-store-service:
    build:
      context: .
      dockerfile: services/event-store-service/Dockerfile
    container_name: sezra-event-store-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      event-store-migrations:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./services/event-store-service:/app

  json-file-adapter:
    build:
      context: .
      dockerfile: services/json-file-adapter/Dockerfile
    container_name: sezra-json-file-adapter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      INPUT_FOLDER: /data/inbox
      PROCESSED_FOLDER: /data/processed
    volumes:
      - ./services/json-file-adapter:/app
      - ./data/json-inbox:/data/inbox
      - ./data/json-processed:/data/processed

  anomaly-detector-service:
    profiles:
      - legacy-detectors
    build:
      context: .
      dockerfile: services/anomaly-detector-service/Dockerfile
    container_name: sezra-anomaly-detector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./services/anomaly-detector-service:/app

  drop-detector-service:
    profiles:
      - drop-detectors
    build:
      context: .
      dockerfile: services/drop-detector-service/Dockerfile
    container_name: sezra-drop-detector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./services/drop-detector-service:/app

  deviation-detector-service:
    build:
      context: .
      dockerfile: services/deviation-detector-service/Dockerfile
    container_name: sezra-deviation-detector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./services/deviation-detector-service:/app
    profiles:
      - deviation-detectors
    restart: unless-stopped
    
  spike-detector-service:
    build:
      context: .
      dockerfile: services/spike-detector-service/Dockerfile
    container_name: sezra-spike-detector-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    profiles:
      - spike-detectors

  analyzer-service:
    build:
      context: .
      dockerfile: services/analyzer-service/Dockerfile
    container_name: sezra-analyzer-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./services/analyzer-service:/app

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: sezra-embedding-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
    volumes:
      - ./services/embedding-service:/app

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    container_name: sezra-api-service
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      event-store-migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./services/api-service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  postgres_data:
  qdrant_data: